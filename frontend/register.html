<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthAI | Register</title>

<link rel="stylesheet" href="css/register.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="background">

<div class="circle circle1"></div>
<div class="circle circle2"></div>

</div>

<div class="register-container">

<div class="left-panel">

<i class="fa-solid fa-heart-pulse logo-icon"></i>

<h1>HealthAI</h1>

<h2>Create Your Healthcare Account</h2>

<p>

Join HealthAI to access AI-powered disease prediction,
medical history, nearby hospitals,
medicine reminders, and intelligent healthcare support.

</p>

</div>

<div class="register-box">

<h2>Create Account</h2>

<p>

Register to start using HealthAI.

</p>

<form id="registerForm">

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-cake-candles"></i>

<input
type="number"
id="age"
placeholder="Age"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-venus-mars"></i>

<select id="gender" required>

<option value="">Select Gender</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

<option value="Other">Other</option>

</select>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye toggle-password"
id="togglePassword"></i>

</div>

<div class="strength">

<div id="strengthBar"></div>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>

</form>

<p class="register-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script>

const togglePassword=document.getElementById("togglePassword");
const password=document.getElementById("password");

togglePassword.addEventListener("click",()=>{

const type=password.type==="password"?"text":"password";

password.type=type;

togglePassword.classList.toggle("fa-eye-slash");

});

password.addEventListener("input",()=>{

const strength=document.getElementById("strengthBar");

const value=password.value.length;

if(value<4){

strength.style.width="30%";
strength.style.background="#EF4444";

}else if(value<8){

strength.style.width="60%";
strength.style.background="#F59E0B";

}else{

strength.style.width="100%";
strength.style.background="#22C55E";

}

});

</script>

<script src="js/register.js"></script>

</body>

</html>
